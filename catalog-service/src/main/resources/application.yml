server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shasthi}
    username: ${SPRING_DATASOURCE_USERNAME:shasthi}
    password: ${SPRING_DATASOURCE_PASSWORD:shasthi-local}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:shasthi-jwt-secret}

logging:
  level:
    root: INFO
    com.shasthi: DEBUG
