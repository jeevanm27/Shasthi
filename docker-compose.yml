services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-shasthi}
      POSTGRES_USER:     ${POSTGRES_USER:-shasthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shasthi-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shasthi} -d ${POSTGRES_DB:-shasthi}"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ─── Redis Stack (includes RediSearch module) ────────────────────────────────
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"    # Redis protocol
      - "8001:8001"    # RedisInsight web UI  →  http://localhost:8001
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Zookeeper (required by Kafka) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Apache Kafka ────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for inter-container (Docker network), one for host dev access
      KAFKA_LISTENERS:             PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS:  PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "29092:29092"  # host access for debugging (kafka-console-consumer, etc.)
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── User & Cart Service (Node.js) ──────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      PORT:              4000
      DATABASE_URL:      postgresql://${POSTGRES_USER:-shasthi}:${POSTGRES_PASSWORD:-shasthi-local}@postgres:5432/${POSTGRES_DB:-shasthi}
      JWT_SECRET:        ${JWT_SECRET:-shasthi-jwt-secret}
      JWT_EXPIRES_IN:    ${JWT_EXPIRES_IN:-7d}
      ADMIN_KEY:         ${ADMIN_KEY:-shasthi-admin-2024}
      REDIS_URL:         ${REDIS_URL:-redis://redis:6379}
      KAFKA_BROKERS:     ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID:   ${KAFKA_CLIENT_ID:-user-service}
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      kafka:     { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  # ─── Catalog & Search Service (Java Spring Boot) ────────────────────────────
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shasthi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shasthi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shasthi-local}
      SPRING_REDIS_URL:           ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET:                 ${JWT_SECRET:-shasthi-jwt-secret}
      SERVER_PORT:                8080
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # ─── Order & Inventory Service (Java Spring Boot) ───────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shasthi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shasthi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shasthi-local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_GROUP_ID:             ${KAFKA_GROUP_ID:-order-service-group}
      JWT_SECRET:                 ${JWT_SECRET:-shasthi-jwt-secret}
      SERVER_PORT:                8081
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # ─── NGINX — API Gateway + SPA Host ─────────────────────────────────────────
  # Build context is the REPO ROOT so the Dockerfile can COPY ./frontend and ./nginx
  nginx:
    build:
      context: .          # repo root  ← allows access to ./frontend/
      dockerfile: nginx/Dockerfile
    ports:
      - "3000:80"      # ← single public entry point
    depends_on:
      user-service:    { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      order-service:   { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
