services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shasthi
      POSTGRES_USER: shasthi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shasthi-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shasthi -d shasthi"]
      interval: 5s
      timeout: 3s
      retries: 10
  catalog-service:
    build: ./backend
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-shasthi-admin}
      DATABASE_URL: postgresql://shasthi:${POSTGRES_PASSWORD:-shasthi-local-password}@postgres:5432/shasthi
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  order-service:
    build: ./order-service
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-shasthi-admin}
      DATABASE_URL: jdbc:postgresql://postgres:5432/shasthi
      POSTGRES_USER: shasthi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shasthi-local-password}
      CATALOG_URL: http://catalog-service:8080
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
  insights-service:
    build: ./insights-service
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      catalog-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      insights-service: { condition: service_healthy }
volumes:
  postgres_data:
