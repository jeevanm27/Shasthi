worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # ─── Upstream definitions ────────────────────────────────────────────────────
  upstream user_service {
    server user-service:4000;
  }

  upstream catalog_service {
    server catalog-service:8080;
  }

  upstream order_service {
    server order-service:8081;
  }

  server {
    listen 80;
    server_name _;

    # ─── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # ─── API Routes ────────────────────────────────────────────────────────────

    # User authentication & profile
    location /api/users/ {
      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Shopping cart & checkout (also handled by user-service)
    location /api/cart/ {
      proxy_pass         http://user_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Product catalog & search
    location /api/catalog/ {
      proxy_pass         http://catalog_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Orders & inventory
    location /api/orders/ {
      proxy_pass         http://order_service;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # ─── React SPA (catch-all) ─────────────────────────────────────────────────
    # Serve static assets, fall back to index.html for client-side routing
    location / {
      root       /usr/share/nginx/html;
      index      index.html;
      try_files  $uri $uri/ /index.html;

      # Cache static assets aggressively
      location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
      }
    }

    # ─── Health check endpoint ─────────────────────────────────────────────────
    location /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
