spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shasthi}
    username: ${POSTGRES_USER:shasthi}
    password: ${POSTGRES_PASSWORD:shasthi-local-password}
  sql:
    init:
      mode: always
server:
  port: ${PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
